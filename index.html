<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePost - A Safe Social Media Platform</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
        .clay-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            box-shadow: 
                20px 20px 60px rgba(0, 0, 0, 0.05),
                -20px -20px 60px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        .clay-button {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 
                8px 8px 16px rgba(0, 0, 0, 0.1),
                -8px -8px 16px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .clay-button:hover {
            box-shadow: 
                4px 4px 8px rgba(0, 0, 0, 0.1),
                -4px -4px 8px rgba(255, 255, 255, 0.8);
            transform: translateY(2px);
        }
        #app {
            background: #f0f4f8;
            min-height: 100vh;
        }
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="app" class="p-4">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <div class="clay-container p-6 mb-8">
                <h1 class="text-3xl font-bold text-center text-blue-600">SafePost</h1>
                <p class="text-center text-gray-600 mt-2">Share positivity, safely.</p>
            </div>

            <!-- Post Creation -->
            <div class="clay-container p-6 mb-8">
                <div class="mb-4">
                    <textarea 
                        v-model="newPost.text" 
                        class="w-full p-4 rounded-xl border focus:outline-none focus:ring-2 focus:ring-blue-400"
                        placeholder="Share your thoughts..."
                        rows="3"
                    ></textarea>
                </div>
                <div class="mb-4">
                    <input 
                        type="file" 
                        ref="fileInput"
                        @change="handleFileUpload" 
                        accept="image/*"
                        class="hidden"
                    >
                    <button 
                        @click="$refs.fileInput.click()"
                        class="clay-button px-4 py-2 text-blue-600"
                    >
                        <i class="bi bi-image"></i> Add Image
                    </button>
                    <span v-if="newPost.image" class="ml-2 text-green-600">
                        Image selected
                    </span>
                </div>
                <div class="flex justify-end">
                    <button 
                        @click="createPost" 
                        class="clay-button px-6 py-2 bg-blue-600 text-white"
                        :disabled="isPosting"
                    >
                        <span v-if="!isPosting">Post</span>
                        <div v-else class="loading-spinner"></div>
                    </button>
                </div>
            </div>

            <!-- Posts Feed -->
            <div v-if="posts.length > 0" class="space-y-6">
                <div v-for="post in posts" :key="post._id" class="clay-container p-6">
                    <div class="flex items-center mb-4">
                        <div class="w-10 h-10 rounded-full bg-blue-200 flex items-center justify-center">
                            <i class="bi bi-person-fill text-blue-600"></i>
                        </div>
                        <div class="ml-3">
                            <p class="font-semibold">Anonymous User</p>
                            <p class="text-sm text-gray-500">Just now</p>
                        </div>
                    </div>
                    <p class="text-gray-700 mb-4">{{ post.text }}</p>
                    <img v-if="post.imageUrl" :src="post.imageUrl" class="rounded-xl w-full mb-4">
                    <div class="flex space-x-4">
                        <button class="clay-button px-4 py-2 text-blue-600">
                            <i class="bi bi-heart"></i> Like
                        </button>
                        <button class="clay-button px-4 py-2 text-blue-600">
                            <i class="bi bi-chat"></i> Comment
                        </button>
                    </div>
                </div>
            </div>
            <div v-else class="clay-container p-6 text-center text-gray-600">
                No posts yet. Be the first to share something positive!
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    posts: [],
                    newPost: {
                        text: '',
                        image: null
                    },
                    isPosting: false
                }
            },
            methods: {
                handleFileUpload(event) {
                    this.newPost.image = event.target.files[0]
                },
                async uploadImage(file) {
                    const formData = new FormData()
                    formData.append('file', file)
                    formData.append('userId', 'anonymous')
                    formData.append('appSlug', 'safepost-123')

                    const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/storage/upload', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer cR0B7wyVLcbjtIyuwRyQp7R3y2r2'
                        },
                        body: formData
                    })
                    return await response.json()
                },
                async analyzeContent(text, imageUrl = null) {
                    const messages = [
                        {
                            role: 'user',
                            content: [
                                {
                                    type: 'text',
                                    text: `Analyze if this content is safe and positive: ${text}`
                                }
                            ]
                        }
                    ]

                    if (imageUrl) {
                        messages[0].content.push({
                            type: 'image_url',
                            image_url: {
                                url: imageUrl
                            }
                        })
                    }

                    const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/ai', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer cR0B7wyVLcbjtIyuwRyQp7R3y2r2',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ messages })
                    })
                    return await response.json()
                },
                async createPost() {
                    if (!this.newPost.text && !this.newPost.image) return

                    this.isPosting = true
                    try {
                        let imageUrl = null
                        if (this.newPost.image) {
                            const uploadResult = await this.uploadImage(this.newPost.image)
                            imageUrl = uploadResult.url
                        }

                        // Analyze content
                        const analysis = await this.analyzeContent(this.newPost.text, imageUrl)
                        
                        // Simple check for harmful content (you might want to make this more sophisticated)
                        if (analysis.message.toLowerCase().includes('harmful') || 
                            analysis.message.toLowerCase().includes('inappropriate') ||
                            analysis.message.toLowerCase().includes('negative')) {
                            alert('Your post contains inappropriate content. Please revise and try again.')
                            return
                        }

                        // Save to MongoDB
                        const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer cR0B7wyVLcbjtIyuwRyQp7R3y2r2',
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                appSlug: 'safepost-123',
                                action: 'create',
                                collection: 'posts',
                                data: {
                                    text: this.newPost.text,
                                    imageUrl,
                                    createdAt: new Date().toISOString()
                                }
                            })
                        })

                        const result = await response.json()
                        if (result.success) {
                            this.posts.unshift({
                                _id: result.result.insertedId,
                                text: this.newPost.text,
                                imageUrl
                            })
                            this.newPost.text = ''
                            this.newPost.image = null
                            if (this.$refs.fileInput) this.$refs.fileInput.value = ''
                        }
                    } catch (error) {
                        console.error('Error creating post:', error)
                        alert('Error creating post. Please try again.')
                    } finally {
                        this.isPosting = false
                    }
                }
            },
            async mounted() {
                try {
                    const response = await fetch('https://r0c8kgwocscg8gsokogwwsw4.zetaverse.one/mongodb', {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer cR0B7wyVLcbjtIyuwRyQp7R3y2r2',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            appSlug: 'safepost-123',
                            action: 'read',
                            collection: 'posts'
                        })
                    })
                    const result = await response.json()
                    if (result.success) {
                        this.posts = result.result
                    }
                } catch (error) {
                    console.error('Error fetching posts:', error)
                }
            }
        }).mount('#app')
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
